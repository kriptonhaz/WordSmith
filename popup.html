<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>WordSmith</h1>
        <button id="settingsBtn" class="settings-btn" title="Settings">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M12 1v6m0 6v6m11-7h-6m-6 0H1m20.364-5.636l-4.243 4.243m-5.657 5.657l-4.243 4.243M20.364 18.364l-4.243-4.243m-5.657-5.657L6.464 6.464"
            ></path>
          </svg>
        </button>
      </div>

      <div class="input-group">
        <label for="inputText">Input Text:</label>
        <textarea
          id="inputText"
          placeholder="Enter your text here..."
          rows="4"
        ></textarea>
      </div>

      <div class="input-group">
        <label for="rephraseMode">Rephrase Mode:</label>
        <select id="rephraseMode">
          <option value="formal">Formal</option>
          <option value="casual">Casual</option>
          <option value="friendly">Friendly</option>
          <option value="concise">Concise</option>
          <option value="funny">Funny</option>
          <option value="persuasive">Persuasive</option>
          <option value="simplified">Simplified</option>
          <option value="academic">Academic</option>
        </select>
      </div>

      <button id="wordSmithBtn">Smithen</button>

      <div class="input-group">
        <label for="resultText">Result:</label>
        <textarea
          id="resultText"
          placeholder="Result will appear here..."
          rows="4"
          readonly
        ></textarea>
        <button id="copyBtn" class="copy-btn" title="Copy result">
          Copy Result
        </button>
      </div>

      <div id="status"></div>

      <div class="footer">
        <a
          href="https://wordsmith-proxy.netlify.app/how-to.html"
          target="_blank"
          class="footer-link help-link"
          title="How to get free API key"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          Get Free API Key
        </a>
        <a
          href="https://github.com/kriptonhaz/WordSmith"
          target="_blank"
          class="footer-link github-link"
          title="View on GitHub"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
          GitHub
        </a>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="closeSettingsBtn" class="close-btn">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <div class="input-group">
            <label>
              <input type="checkbox" id="enablePopupBalloon" checked />
              Enable Popup Balloon on Text Selection
            </label>
            <p style="font-size: 12px; color: #666; margin: 5px 0 0 24px">
              Show the popup balloon when you select text on web pages
            </p>
          </div>

          <div class="input-group">
            <label>
              <input type="checkbox" id="useDefaultApi" checked />
              Use Default API
            </label>
          </div>

          <div id="customApiSettings" style="display: none">
            <div class="input-group">
              <label for="apiProvider">API Provider:</label>
              <select id="apiProvider">
                <option value="openai">OpenAI</option>
                <option value="claude">Claude</option>
                <option value="gemini">Gemini</option>
                <option value="deepseek">DeepSeek</option>
                <option value="openrouter">OpenRouter</option>
                <option value="routeway">RouteWay</option>
                <option value="zai">Z.AI</option>
              </select>
            </div>

            <div class="input-group">
              <label for="modelName">Model Name:</label>
              <input
                type="text"
                id="modelName"
                placeholder="Enter model name"
              />
            </div>

            <div class="input-group">
              <label for="apiKey">API Key:</label>
              <input
                type="password"
                id="apiKey"
                placeholder="Enter your API key"
              />
            </div>
          </div>

          <div class="modal-footer">
            <button id="saveSettingsBtn" class="save-btn">Save Settings</button>
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
